name: Publish Masrofy APK
on:
  push:
    branches: [masrofy-release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Flutter source
        run: |
          base64 -d masrofy/app-source.tar.xz.b64 | tar -xJf -
          ls lib pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.masrofy --project-name masrofy .
          rm -f test/widget_test.dart
      - name: Install Flutter packages
        run: flutter pub get
      - name: Fix file-picker Android compile SDK
        run: |
          for f in "$HOME"/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle*; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdkVersion[[:space:]]+34/compileSdkVersion 36/g; s/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g; s/compileSdk[[:space:]]+34/compileSdk 36/g' "$f"
            fi
          done
      - name: Test
        run: flutter test
      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Masrofy-v1.1.0-Android.apk
          sha256sum Masrofy-v1.1.0-Android.apk
      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create masrofy-v1.1.0 ./Masrofy-v1.1.0-Android.apk \
            --title "Masrofy v1.1.0 Android APK" \
            --notes "Masrofy personal finance tracker for Android with recurring expenses, separate savings goals, budget alerts, weekly spending limits and backups." \
            --target "${GITHUB_SHA}" \
            --latest
